<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>Knitting Chart Marker</title>
  <meta name="theme-color" content="#f7f7f8">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Knitting Chart Marker</h1>
    </header>

    <section class="toolbar">
      <label class="file-button">
        Open PDF
        <input type="file" id="pdfInput" accept="application/pdf">
      </label>

      <div class="page-controls">
        <button id="prevPage">PREV</button>
        <button id="nextPage">NEXT</button>
        <span id="pageInfo">- / -</span>
      </div>

      <div class="zoom-controls">
        <button id="zoomOut">-</button>
        <span id="zoomInfo">150%</span>
        <button id="zoomIn">+</button>
      </div>
    </section>

    <section class="viewer-wrap">
      <div id="pdfContainer">
        <canvas id="pdfCanvas" tabindex="0"></canvas>
        <div id="rowMarker"></div>
        <div id="verticalMarker1" class="vertical-marker" aria-label="Vertical marker 1"></div>
        <div id="verticalMarker2" class="vertical-marker" aria-label="Vertical marker 2"></div>
      </div>
    </section>

    <section class="marker-controls">
      <button id="nudgeUp">O▲</button>
      <button id="upSmall">R▲</button>
      <button id="downSmall">R▼</button>
      <button id="nudgeDown">O▼</button>
      
      <button id="heightDown">H-</button>
      <button id="heightUp">H+</button>

      <div class="control-divider"></div>
      <button class="vertical-mode-button active" data-vertical-mode="0">V0</button>
      <button class="vertical-mode-button" data-vertical-mode="1">V1</button>
      <button class="vertical-mode-button" data-vertical-mode="2">V2</button>

      <button class="color-button color-blue" data-color="blue" aria-label="Blue marker"></button>
      <button class="color-button color-yellow" data-color="yellow" aria-label="Yellow marker"></button>
      <button class="color-button color-pink" data-color="pink" aria-label="Pink marker"></button>
      <button class="color-button color-green" data-color="green" aria-label="Green marker"></button>
      <button class="color-button color-gray" data-color="gray" aria-label="Gray marker"></button>
    </section>
  </main>

  <script src="./script.js" type="module"></script>
</body>
</html>
